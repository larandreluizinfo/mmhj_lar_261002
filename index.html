<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corrida Maluca</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 20px; }
    h1 { margin-bottom: 0; }
    .pista { max-width: 700px; margin: 20px auto; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .corredor { display: flex; align-items: center; gap: 8px; border-bottom: 2px dashed #ccc; padding: 10px 0; }
    .corredor:last-child { border-bottom: none; }
    .nome { width: 160px; font-weight: bold; text-align: right; font-size: 14px; }
    .trilha { position: relative; flex: 1; height: 56px; background: #e9e9e9; border-radius: 20px; overflow: hidden; }
    .carro { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 64px; transition: left 0.2s; }
    .carro svg { display: block; width: 64px; height: 40px; }
    #resultado { font-size: 1.4em; font-weight: bold; margin: 16px 0; min-height: 1.5em; }
    button { font-size: 1.1em; padding: 10px 24px; border: none; border-radius: 8px; background: #27ae60; color: #fff; cursor: pointer; margin: 4px; }
    button:disabled { background: #999; }
    #reiniciar { background: #e67e22; }
    footer { margin-top: 20px; color: #555; }
  </style>
</head>
<body>
  <h1>Corrida Maluca 🏁</h1>
  <p>4 corredores disputando a vitória!</p>

  <div class="pista" id="pista">
    <div class="corredor" data-nome="Miguel">
      <span class="nome">Miguel 🩵 verde-água</span>
      <div class="trilha"><span class="carro">
        <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="18" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="18" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <ellipse cx="48" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="48" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <rect x="4" y="18" width="56" height="12" rx="6" fill="#2DD4BF" stroke="#0d9488" stroke-width="2"/>
          <rect x="22" y="10" width="22" height="12" rx="4" fill="#2DD4BF" stroke="#0d9488" stroke-width="2"/>
          <circle cx="33" cy="12" r="6" fill="#fff" stroke="#0d9488" stroke-width="2"/>
          <rect x="33" y="6" width="6" height="12" fill="#0d9488" transform="rotate(20 36 12)"/>
          <rect x="28" y="10" width="8" height="4" rx="2" fill="#333"/>
        </svg>
      </span></div>
    </div>
    <div class="corredor" data-nome="Manuella G.">
      <span class="nome">Manuella G. 💜 roxo-claro</span>
      <div class="trilha"><span class="carro">
        <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="18" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="18" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <ellipse cx="48" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="48" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <rect x="4" y="18" width="56" height="12" rx="6" fill="#C084FC" stroke="#9333EA" stroke-width="2"/>
          <rect x="22" y="10" width="22" height="12" rx="4" fill="#C084FC" stroke="#9333EA" stroke-width="2"/>
          <circle cx="33" cy="12" r="6" fill="#fff" stroke="#9333EA" stroke-width="2"/>
          <rect x="33" y="6" width="6" height="12" fill="#9333EA" transform="rotate(20 36 12)"/>
          <rect x="28" y="10" width="8" height="4" rx="2" fill="#333"/>
        </svg>
      </span></div>
    </div>
    <div class="corredor" data-nome="Helena">
      <span class="nome">Helena ❤️ vermelho</span>
      <div class="trilha"><span class="carro">
        <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="18" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="18" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <ellipse cx="48" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="48" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <rect x="4" y="18" width="56" height="12" rx="6" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>
          <rect x="22" y="10" width="22" height="12" rx="4" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>
          <circle cx="33" cy="12" r="6" fill="#fff" stroke="#B91C1C" stroke-width="2"/>
          <rect x="33" y="6" width="6" height="12" fill="#B91C1C" transform="rotate(20 36 12)"/>
          <rect x="28" y="10" width="8" height="4" rx="2" fill="#333"/>
        </svg>
      </span></div>
    </div>
    <div class="corredor" data-nome="João B.">
      <span class="nome">João B. 💙 azul</span>
      <div class="trilha"><span class="carro">
        <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="18" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="18" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <ellipse cx="48" cy="32" rx="8" ry="8" fill="#222"/><ellipse cx="48" cy="32" rx="3.5" ry="3.5" fill="#999"/>
          <rect x="4" y="18" width="56" height="12" rx="6" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
          <rect x="22" y="10" width="22" height="12" rx="4" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
          <circle cx="33" cy="12" r="6" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
          <rect x="33" y="6" width="6" height="12" fill="#1D4ED8" transform="rotate(20 36 12)"/>
          <rect x="28" y="10" width="8" height="4" rx="2" fill="#333"/>
        </svg>
      </span></div>
    </div>
  </div>

  <div id="resultado"></div>
  <button id="largar">Largar! 🏁</button>
  <button id="reiniciar">Reiniciar 🔄</button>

  <footer>
    <p>Projeto criado por: Miguel, Manuella G., Helena, João B.</p>
    <p><a href="https://github.com/larandreluizinfo/mmhj_lar_261002">GitHub</a></p>
  </footer>

  <script>
    const carros = document.querySelectorAll('.carro');
    const resultado = document.getElementById('resultado');
    const btnLargar = document.getElementById('largar');
    const btnReiniciar = document.getElementById('reiniciar');
    let posicoes = [0, 0, 0, 0];
    let intervalo = null;

    function reiniciar() {
      clearInterval(intervalo);
      intervalo = null;
      posicoes = [0, 0, 0, 0];
      carros.forEach(c => c.style.left = '0%');
      resultado.textContent = '';
      btnLargar.disabled = false;
    }

    function largar() {
      reiniciar();
      btnLargar.disabled = true;
      intervalo = setInterval(() => {
        let vencedor = -1;
        for (let i = 0; i < 4; i++) {
          posicoes[i] += Math.random() * 4;
          if (posicoes[i] >= 90) { posicoes[i] = 90; vencedor = i; }
          carros[i].style.left = posicoes[i] + '%';
        }
        if (vencedor !== -1) {
          clearInterval(intervalo);
          const nome = document.querySelectorAll('.corredor')[vencedor].dataset.nome;
          resultado.textContent = '🏆 ' + nome + ' venceu a Corrida Maluca!';
          btnLargar.disabled = false;
        }
      }, 100);
    }

    btnLargar.addEventListener('click', largar);
    btnReiniciar.addEventListener('click', reiniciar);
  </script>
</body>
</html>
