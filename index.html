<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corrida Maluca 3D — 500 km BMW</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #0b1622; margin: 0; padding: 12px; color: #fff; }
    h1 { margin: 4px 0 0; text-shadow: 2px 2px #000; }
    .sub { opacity: .85; margin: 2px 0 8px; }
    #wrap { max-width: 960px; margin: 0 auto; }
    #cena { width: 100%; height: 480px; border-radius: 12px; border: 3px solid #333; display: block; background: #87CEEB; }
    .painel { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: #111; border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-weight: bold; }
    .painel span { font-size: 14px; }
    #placar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .kart { background: #1c2833; border-radius: 10px; padding: 8px; border-top: 6px solid #fff; font-size: 13px; }
    .kart b { display: block; font-size: 14px; }
    .kart .kmh { color: #7CFC00; font-weight: bold; } .kart .kmd { color: #87CEFA; }
    .botoes { margin-top: 10px; }
    button { font-size: 1.05em; padding: 12px 26px; border: none; border-radius: 10px; background: #27ae60; color: #fff; cursor: pointer; margin: 4px; font-weight: bold; }
    button:disabled { background: #777; }
    #reiniciar { background: #e67e22; }
    .dist-btns button { font-size: .85em; padding: 6px 12px; background: #34495e; }
    .dist-btns button.ativo { outline: 3px solid #f7d154; }
    #juiz-fala { background: #fff; color: #111; border-radius: 10px; padding: 8px 14px; margin-top: 10px; font-weight: bold; }
    #resultado { font-size: 1.4em; font-weight: bold; margin: 12px 0; min-height: 1.4em; text-shadow: 2px 2px #000; }
    #torcida { font-size: 22px; }
    footer { margin: 14px 0; opacity: .8; } footer a { color: #fff; }
  </style>
</head>
<body>
<div id="wrap">
  <h1>Corrida Maluca 3D 🏁 BMW</h1>
  <p class="sub">4 BMWs em 3D real • pista de <b id="dist-rotulo">500 km</b> • arraste para girar, scroll para zoom</p>
  <canvas id="cena"></canvas>

  <div class="painel">
    <span>🏁 <b id="dist-total">500 km</b></span>
    <span>⏱️ <b id="tempo">00:00</b></span>
    <span>🥇 <b id="lider">—</b></span>
    <span>🎥 <b>3D</b></span>
  </div>

  <div class="dist-btns" style="margin-top:8px" id="cambtns">
    🎥 Câmera:
    <button data-cam="lider" class="ativo">Seguir líder</button>
    <button data-cam="pelotao">Pelotão</button>
    <button data-cam="livre">Livre</button>
  </div>

  <div class="dist-btns" style="margin-top:8px">
    Pista:
    <button data-km="100">100 km</button>
    <button data-km="300">300 km</button>
    <button data-km="500" class="ativo">500 km</button>
    <button data-km="800">800 km</button>
  </div>

  <div id="torcida">🧑 👩 👧 👦 🎉 👏 🧒 👵 👴 🎊 👏 🎉</div>
  <div id="juiz-fala">🧑‍⚖️ Juiz: Preparar... 500 km pela frente! 🚦</div>
  <div id="placar"></div>
  <div id="resultado"></div>
  <div class="botoes">
    <button id="largar">Largar! 🏁</button>
    <button id="reiniciar">Reiniciar 🔄</button>
  </div>
  <footer>
    <p>Projeto criado por: Miguel, Manuella G., Helena, João B.</p>
    <p><a href="https://github.com/larandreluizinfo/mmhj_lar_261002">GitHub</a></p>
  </footer>
</div>

<script>
const pilotos = [
  { nome: 'Miguel', modelo: 'BMW azul', cor: 0x3B82F6, base: 318 },
  { nome: 'Manuella G.', modelo: 'BMW roxa', cor: 0x9333EA, base: 325 },
  { nome: 'Helena', modelo: 'BMW verde-água', cor: 0x2DD4BF, base: 315 },
  { nome: 'João B.', modelo: 'BMW vermelha', cor: 0xEF4444, base: 322 },
];
const TIME_SCALE = 240;
let TOTAL_KM = 500;
const TRACK_LEN = 600; // unidades 3D
const LANES = [-9, -3, 3, 9];

// ---------- cena ----------
const canvas = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 120, 420);
const camera = new THREE.PerspectiveCamera(60, 2, 0.1, 1000);
camera.position.set(-30, 26, 30);

const hemi = new THREE.HemisphereLight(0xffffff, 0x3a7d2c, 0.9);
scene.add(hemi);
const sol = new THREE.DirectionalLight(0xffffff, 0.9);
sol.position.set(-40, 80, 40);
sol.castShadow = true;
sol.shadow.camera.left = -80; sol.shadow.camera.right = 200;
sol.shadow.camera.top = 80; sol.shadow.camera.bottom = -80;
scene.add(sol);

// chão / grama
const grama = new THREE.Mesh(
  new THREE.PlaneGeometry(TRACK_LEN + 220, 220),
  new THREE.MeshLambertMaterial({ color: 0x5da24a })
);
grama.rotation.x = -Math.PI / 2;
grama.position.x = TRACK_LEN / 2;
grama.receiveShadow = true;
scene.add(grama);

// asfalto
const asfalto = new THREE.Mesh(
  new THREE.PlaneGeometry(TRACK_LEN + 40, 30),
  new THREE.MeshLambertMaterial({ color: 0x3d3d3d })
);
asfalto.rotation.x = -Math.PI / 2;
asfalto.position.set(TRACK_LEN / 2, 0.02, 0);
asfalto.receiveShadow = true;
scene.add(asfalto);

// faixas entre pistas
for (let i = 0; i < 3; i++) {
  const z = (LANES[i] + LANES[i + 1]) / 2;
  for (let x = 0; x < TRACK_LEN; x += 8) {
    const f = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.35), new THREE.MeshBasicMaterial({ color: 0xf7d154 }));
    f.rotation.x = -Math.PI / 2;
    f.position.set(x, 0.05, z);
    scene.add(f);
  }
}
// zebrinhas laterais
for (let x = -10; x < TRACK_LEN + 20; x += 6) {
  [[-15.5, 0xff0000], [15.5, 0xffffff]].forEach(([z, c]) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.4), new THREE.MeshBasicMaterial({ color: c }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.04, z);
    scene.add(m);
  });
}
// linha de largada + chegada xadrez
function quadriculado(w, d) {
  const cv = document.createElement('canvas'); cv.width = 8; cv.height = 4;
  const g = cv.getContext('2d');
  for (let y = 0; y < 4; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? '#000' : '#fff'; g.fillRect(x * 10, y * 10, 10, 10); }
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: t }));
}
const larg = new THREE.Mesh(new THREE.PlaneGeometry(2, 30), new THREE.MeshBasicMaterial({ color: 0xffffff }));
larg.rotation.x = -Math.PI / 2; larg.position.set(0, 0.06, 0); scene.add(larg);
const cheg = quadriculado(4, 30);
cheg.rotation.x = -Math.PI / 2; cheg.position.set(TRACK_LEN, 0.06, 0); scene.add(cheg);
// pórtico de chegada
const portico = new THREE.Group();
const matP = new THREE.MeshLambertMaterial({ color: 0x222222 });
[[-16], [16]].forEach(([z]) => {
  const poste = new THREE.Mesh(new THREE.BoxGeometry(1.5, 16, 1.5), matP);
  poste.position.set(TRACK_LEN, 8, z); poste.castShadow = true; portico.add(poste);
});
const topo = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 34), new THREE.MeshLambertMaterial({ color: 0x111111 }));
topo.position.set(TRACK_LEN, 16.5, 0); portico.add(topo);
scene.add(portico);

// árvores
for (let i = 0; i < 60; i++) {
  const x = Math.random() * (TRACK_LEN + 100) - 40;
  const z = (Math.random() < 0.5 ? -1 : 1) * (22 + Math.random() * 60);
  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4), new THREE.MeshLambertMaterial({ color: 0x6b4423 }));
  tronco.position.set(x, 2, z); scene.add(tronco);
  const copa = new THREE.Mesh(new THREE.ConeGeometry(2.5 + Math.random() * 2, 7, 8), new THREE.MeshLambertMaterial({ color: 0x2e7d32 }));
  copa.position.set(x, 7, z); copa.castShadow = true; scene.add(copa);
}

// arquibancada + torcedores 3D
const torcedores = [];
(function arquibancada(zBase, rot) {
  const base = new THREE.Mesh(new THREE.BoxGeometry(90, 10, 24), new THREE.MeshLambertMaterial({ color: 0x8d6e63 }));
  base.position.set(30, 5, zBase); scene.add(base);
  for (let f = 0; f < 3; f++) {
    const deg = new THREE.Mesh(new THREE.BoxGeometry(90, 2, 6), new THREE.MeshLambertMaterial({ color: f % 2 ? 0xa1887f : 0x6d4c41 }));
    deg.position.set(30, 11 + f * 3, zBase + (rot > 0 ? -f * 5 : f * 5)); scene.add(deg);
    for (let k = 0; k < 40; k++) {
      const c = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 8),
        new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6) }));
      c.position.set(-10 + Math.random() * 80, 13 + f * 3, deg.position.z + (Math.random() - 0.5) * 3);
      c.userData.y0 = c.position.y;
      c.userData.fase = Math.random() * 9;
      scene.add(c); torcedores.push(c);
    }
  }
})(-38, -1);
(function arquibancada2() {
  const base = new THREE.Mesh(new THREE.BoxGeometry(90, 10, 24), new THREE.MeshLambertMaterial({ color: 0x8d6e63 }));
  base.position.set(TRACK_LEN - 30, 5, 38); scene.add(base);
  for (let k = 0; k < 50; k++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 8),
      new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6) }));
    c.position.set(TRACK_LEN - 70 + Math.random() * 80, 12 + Math.random() * 6, 34 + Math.random() * 8);
    c.userData.y0 = c.position.y; c.userData.fase = Math.random() * 9;
    scene.add(c); torcedores.push(c);
  }
})();

// juiz 3D com bandeira
const juiz = new THREE.Group();
const corpoJ = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 3.4), new THREE.MeshLambertMaterial({ color: 0x111111 }));
corpoJ.position.y = 1.7; juiz.add(corpoJ);
const cabJ = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshLambertMaterial({ color: 0xffcc99 }));
cabJ.position.y = 4; juiz.add(cabJ);
const mastro = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4), new THREE.MeshLambertMaterial({ color: 0x888888 }));
mastro.position.set(1.2, 5, 0); juiz.add(mastro);
const band = quadriculado(2.6, 1.6);
band.position.set(2.6, 6, 0); band.rotation.y = Math.PI / 2; juiz.add(band);
juiz.position.set(-6, 0, -20);
scene.add(juiz);

// ---------- carros BMW 3D ----------
function criaBMW(cor) {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhongMaterial({ color: cor, shininess: 90 });
  const esc = new THREE.MeshPhongMaterial({ color: 0x111111 });
  const vidro = new THREE.MeshPhongMaterial({ color: 0xbfe3f5, shininess: 120 });
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(7.2, 1.3, 3.4), mat);
  corpo.position.y = 1.25; corpo.castShadow = true; g.add(corpo);
  const bico = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 3.2), mat);
  bico.position.set(4.2, 1.0, 0); g.add(bico);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.0, 2.8), vidro);
  cab.position.set(-0.3, 2.3, 0); g.add(cab);
  // piloto + capacete
  const capacete = new THREE.Mesh(new THREE.SphereGeometry(0.65, 14, 14), new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 100 }));
  capacete.position.set(-0.3, 2.5, 0); g.add(capacete);
  const viseira = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 1.0), esc);
  viseira.position.set(0.25, 2.5, 0); g.add(viseira);
  // faróis / lanternas / grade BMW
  const farol = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.45, 0.7), new THREE.MeshBasicMaterial({ color: 0xfff6a0 }));
  farol.position.set(5.12, 1.0, 0.9); g.add(farol);
  const farol2 = farol.clone(); farol2.position.z = -0.9; g.add(farol2);
  const lan = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.7), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  lan.position.set(-3.65, 1.3, 0.9); g.add(lan);
  const lan2 = lan.clone(); lan2.position.z = -0.9; g.add(lan2);
  // rodas
  const rodas = [];
  const geoR = new THREE.CylinderGeometry(0.85, 0.85, 0.7, 16);
  [[2.4, 1.75], [2.4, -1.75], [-2.4, 1.75], [-2.4, -1.75]].forEach(([x, z]) => {
    const r = new THREE.Mesh(geoR, new THREE.MeshPhongMaterial({ color: 0x181818 }));
    r.rotation.x = Math.PI / 2; r.position.set(x, 0.85, z); r.castShadow = true;
    g.add(r); rodas.push(r);
    const aro = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.75, 10), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
    aro.rotation.x = Math.PI / 2; aro.position.set(x, 0.85, z); g.add(aro);
  });
  // nome flutuante
  g.userData = { rodas };
  return g;
}
const carros3D = pilotos.map((p, i) => {
  const c = criaBMW(p.cor);
  c.position.set(0, 0, LANES[i]);
  scene.add(c);
  // etiqueta com nome
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center';
  ctx.fillText(p.nome, 128, 42);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv) }));
  sp.scale.set(10, 2.5, 1); sp.position.set(0, 6, 0);
  c.add(sp);
  return c;
});

// câmera que acompanha os carros (3 modos)
let camModo = 'lider';
let ang = 0.5, raio = 55, my = 26;
let camPos = new THREE.Vector3(-30, 26, 30);
let camAlvo = new THREE.Vector3(10, 2, 0);
let arrastando = false, px = 0, ultimoArrasto = 0;
canvas.addEventListener('pointerdown', e => { arrastando = true; px = e.clientX; if (camModo !== 'livre') setCam('livre'); });
window.addEventListener('pointerup', () => arrastando = false);
window.addEventListener('pointermove', e => { if (arrastando) { ang += (e.clientX - px) * 0.005; px = e.clientX; ultimoArrasto = performance.now(); } });
canvas.addEventListener('wheel', e => { raio = Math.min(160, Math.max(20, raio + e.deltaY * 0.05)); }, { passive: true });
function setCam(m) {
  camModo = m;
  document.querySelectorAll('#cambtns button').forEach(x => x.classList.toggle('ativo', x.dataset.cam === m));
}
document.querySelectorAll('#cambtns button').forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));

// ---------- HUD + física ----------
const placar = document.getElementById('placar');
pilotos.forEach((p, i) => {
  const d = document.createElement('div');
  d.className = 'kart';
  d.style.borderTopColor = '#' + p.cor.toString(16).padStart(6, '0');
  d.innerHTML = `<b>${p.nome}</b>${p.modelo} 🪖<br><span class="kmh" id="kmh${i}">0 km/h</span><br><span class="kmd" id="kmd${i}">0 km</span><br><span id="pos${i}">4º</span>`;
  placar.appendChild(d);
});
const kmhEl = [0,1,2,3].map(i => document.getElementById('kmh' + i));
const kmdEl = [0,1,2,3].map(i => document.getElementById('kmd' + i));
const posEl = [0,1,2,3].map(i => document.getElementById('pos' + i));
const resultado = document.getElementById('resultado');
const juizFala = document.getElementById('juiz-fala');
const torcidaEl = document.getElementById('torcida');
const tempoEl = document.getElementById('tempo');
const liderEl = document.getElementById('lider');
const btnLargar = document.getElementById('largar');
const btnReiniciar = document.getElementById('reiniciar');

let dist = [0,0,0,0], kmh = [0,0,0,0], seg = 0, frame = null, correndo = false, anunciado = 100, last = 0;
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0'); }
function atualizaHUD() {
  const ordem = [0,1,2,3].sort((a,b) => dist[b]-dist[a]);
  const med = ['🥇 1º','🥈 2º','🥉 3º','4º'];
  ordem.forEach((c,r) => posEl[c].textContent = med[r]);
  liderEl.textContent = pilotos[ordem[0]].nome;
  for (let i = 0; i < 4; i++) {
    kmhEl[i].textContent = Math.round(kmh[i]) + ' km/h';
    kmdEl[i].textContent = dist[i].toFixed(1) + ' / ' + TOTAL_KM + ' km';
  }
  tempoEl.textContent = fmt(seg);
}
function reiniciar() {
  cancelAnimationFrame(frame); frame = null; correndo = false;
  dist = [0,0,0,0]; kmh = [0,0,0,0]; seg = 0; anunciado = 100;
  carros3D.forEach(c => c.position.x = 0);
  camPos.set(-30, 26, 30); camAlvo.set(10, 2, 0);
  resultado.textContent = '';
  juizFala.textContent = `🧑‍⚖️ Juiz: Preparar... ${TOTAL_KM} km pela frente! 🚦`;
  torcidaEl.textContent = '🧑 👩 👧 👦 🎉 👏 Torcida: Vai começar! 🎺';
  btnLargar.disabled = false;
  atualizaHUD();
}
function passo(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  seg += dt;
  const tempo = seg;
  for (let i = 0; i < 4; i++) {
    const alvo = pilotos[i].base + Math.sin(tempo * 0.7 + i * 2) * 20 + (Math.random() - 0.5) * 26;
    kmh[i] += (alvo - kmh[i]) * 0.12;
    dist[i] += (kmh[i] / 3600) * dt * TIME_SCALE;
    const x = Math.min(TRACK_LEN, (dist[i] / TOTAL_KM) * TRACK_LEN);
    carros3D[i].position.x = x;
    carros3D[i].position.y = Math.abs(Math.sin(tempo * 30 + i)) * 0.06;
    carros3D[i].userData.rodas.forEach(r => r.rotation.z -= kmh[i] * dt * 0.05);
  }
  torcedores.forEach(c => { c.position.y = c.userData.y0 + Math.abs(Math.sin(tempo * 6 + c.userData.fase)) * 1.2; });
  juiz.position.y = Math.abs(Math.sin(tempo * 4)) * 0.4;
  const lider = dist.indexOf(Math.max(...dist));
  atualizaHUD();
  if (dist[lider] >= anunciado && anunciado < TOTAL_KM) {
    juizFala.textContent = `🧑‍⚖️ Juiz: ${anunciado} km! ${pilotos[lider].nome} lidera!`;
    anunciado += 100;
  }
  if (Math.max(...dist) >= TOTAL_KM) {
    const camp = [0,1,2,3].sort((a,b) => dist[b] - dist[a])[0];
    fim(camp); return;
  }
  frame = requestAnimationFrame(passo);
}
function fim(camp) {
  correndo = false;
  const vMedia = TOTAL_KM / (seg * TIME_SCALE / 3600);
  resultado.innerHTML = `🏆 ${pilotos[camp].nome} (${pilotos[camp].modelo}) venceu os ${TOTAL_KM} km!<br>⏱️ ${fmt(seg)} • média ${Math.round(vMedia)} km/h`;
  juizFala.textContent = `🧑‍⚖️ Juiz: Fim de prova! Vitória de ${pilotos[camp].nome}! 🏁`;
  torcidaEl.textContent = `🎉🎊 ${pilotos[camp].nome} é campeão! 🥳🎊🎉`;
  btnLargar.disabled = false;
}
function largar() {
  reiniciar();
  btnLargar.disabled = true;
  juizFala.textContent = '🧑‍⚖️ Juiz: 3... 2... 1... VAI! 🏁';
  kmh = pilotos.map(p => p.base * 0.4);
  setTimeout(() => {
    correndo = true;
    juizFala.textContent = `🧑‍⚖️ Juiz: VAI! ${TOTAL_KM} km pela frente! 🏁`;
    torcidaEl.textContent = '📣📣 Vai, vai, vai!! 📣📣';
    last = performance.now();
    frame = requestAnimationFrame(passo);
  }, 1200);
}
btnLargar.addEventListener('click', largar);
btnReiniciar.addEventListener('click', reiniciar);
document.querySelectorAll('.dist-btns button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.dist-btns button').forEach(x => x.classList.remove('ativo'));
    b.classList.add('ativo');
    TOTAL_KM = parseInt(b.dataset.km);
    document.getElementById('dist-total').textContent = TOTAL_KM + ' km';
    document.getElementById('dist-rotulo').textContent = TOTAL_KM + ' km';
    reiniciar();
  });
});

// loop de render — câmera acompanha os carros
function liderIdx() { return dist.indexOf(Math.max(...dist)); }
function render(t) {
  requestAnimationFrame(render);
  const t3d = (t || 0) / 1000;
  if (!correndo) torcedores.forEach(c => { c.position.y = c.userData.y0 + Math.abs(Math.sin(t3d * 2 + c.userData.fase)) * 0.3; });
  const L = carros3D[liderIdx()];
  let desPos, desAlvo;
  if (camModo === 'lider') {
    desPos = new THREE.Vector3(L.position.x - 20, 11, L.position.z + 13);
    desAlvo = new THREE.Vector3(L.position.x + 10, 2, L.position.z * 0.4);
  } else if (camModo === 'pelotao') {
    const xs = carros3D.map(c => c.position.x);
    const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
    desPos = new THREE.Vector3(cx - 32, 25, 32);
    desAlvo = new THREE.Vector3(cx + 8, 1, 0);
  } else {
    const Lx = carros3D[liderIdx()].position.x;
    camAlvo.x += (Lx - camAlvo.x) * 0.03;
    desPos = new THREE.Vector3(camAlvo.x - 28 + Math.cos(ang) * 20, my, Math.sin(ang) * raio * 0.7);
    desAlvo = new THREE.Vector3(camAlvo.x + 12, 2, 0);
  }
  const k = camModo === 'livre' ? 0.08 : 0.12;
  camPos.lerp(desPos, k);
  camAlvo.lerp(desAlvo, k);
  camera.position.copy(camPos);
  camera.lookAt(camAlvo);
  renderer.render(scene, camera);
}
function resize() {
  const w = canvas.clientWidth, h = 480;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
render();
reiniciar();
</script>
</body>
